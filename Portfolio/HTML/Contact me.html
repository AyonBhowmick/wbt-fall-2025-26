<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="/Portfolio/CSS/Contact me.css">
</head>

<body>
        <nav>
            <ul>
                <li><a href="/Portfolio/index.html">Home</a></li>
                <li><a href="/Portfolio/HTML/Education.html">Education</a></li>
                <li><a href="/Portfolio/HTML/Experience.html">Experience</a></li>
                <li><a href="/Portfolio/HTML/Project.html">Project</a></li>
            </ul>
        </nav>

        <div class="form-container">
        <h2>Contact Me</h2>

        <form method="POST">
            <div class="form-row">
                <label for="first_name">First Name:</label>
                <input type="text" id="first_name" name="firstname" required>
            </div>
            <div class="form-row">
                <label for="last_name">Last Name:</label>
                <input type="text" id="last_name" name="lastname" required>
            </div>
            <div class="form-row">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-row">
                <label for="company_name">Company Name:</label>
                <input type="text" id="company_name" name="company_name">
            </div>
            
            <div class="form-row1">
                <label>Reason for Contact:</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="Reason for Contact" required>Project<br>
                    </label>
                    <label>
                        <input type="radio" name="Reason for Contact" required>Thesis<br>
                    </label>
                    <label>
                        <input type="radio" name="Reason for Contact" required>Job<br>
                    </label>
            </div>
        </div>

            <div class="form-row2">
                <label>Services Needed:</label>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="service_provided" value="Web Development"> Web Development
                    </label>
                    <label>
                        <input type="checkbox" name="service_provided" value="AI ML Engineer"> AI ML Engineer
                    </label>
                    <label>
                        <input type="checkbox" name="service_provided" value="Software Development"> Software Development
                    </label>
                </div>
            </div>
            
            <div class="form-row">
                <label for="appointment_date">Book an Appointment:</label>
                <input type="date" id="appointment_date" name="appointment_date" required>
            </div>

            <div class="button-group">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </div>
        </form>
    </div>

</body>

</html>
