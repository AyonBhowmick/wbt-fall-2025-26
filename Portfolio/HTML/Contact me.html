<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="/Portfolio/CSS/Contact me.css">
</head>

<body>
    <ul>
        <strong>
            <li><a href="/Portfolio/index.html">Home</a></li>
        </strong>
    </ul>

    <h2>Contact Me</h2>

    <form method="Get">

        First Name: <input type="text" name="firstname" required><br>
        Last Name: <input type="text" name="lastname" required><br>
        Email: <input type="email" required><br>
        Company Name:<input type="text" name="company_name"><br>

        Reason For Contact:<br>
        <input type="radio" name="Reason for Contact" required>Project<br>
        <input type="radio" name="Reason for Contact">Thesis<br>
        <input type="radio" name="Reason for Contact">Job<br>

        Service Provided:<br>
        <input type="checkbox" name="Service Provided" required>Software Engineer<br>
        <input type="checkbox" name="Service Provided" required>AI ML Engineer<br>
        <input type="checkbox" name="Service Provided" required>Web Development<br>

        Book an Appoinment:<br>
        <input type="date" name="Book an Appoinment" required><br>

        <div class="button-group">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>


    </form>
</body>



</html>
